<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>我的衣櫥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/tabler-icons.min.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wardrobe">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <h1 id="app-title" style="display:flex;align-items:center;gap:6px;">我的衣櫥</h1>
      <button id="card-shortcut-btn" onclick="switchTab('card')" style="background:#111;border:none;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:12px;font-family:inherit;color:#fff;display:none;align-items:center;gap:5px;">
        <i class="ti ti-credit-card" style="font-size:13px;"></i>
        <span data-zh="卡片" data-en="Card">卡片</span>
      </button>

    </div>
    <div id="main">
      <div id="outfit-col">
        <div class="cat-row" id="row-top"></div>
        <div class="cat-row" id="row-bottom"></div>
        <div class="cat-row" id="row-jacket"></div>
        <div class="cat-row" id="row-shoes"></div>
      </div>
      <div id="accessory-col">
        <div class="acc-slot" id="acc-slot-0"></div>
        <div class="acc-slot" id="acc-slot-1"></div>
        <div class="acc-slot" id="acc-slot-2"></div>
        <div class="acc-slot" id="acc-slot-3"></div>
      </div>
    </div>
    <!-- Search overlay -->
    <div id="search-overlay" style="display:none;position:absolute;top:57px;left:0;right:0;bottom:0;background:var(--bg);z-index:20;flex-direction:column;">
      <div style="padding:12px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0;display:flex;gap:8px;align-items:center;">
        <input id="search-input" type="text" placeholder="搜尋標籤、品牌、季節..." oninput="doSearch(this.value)"
          style="flex:1;padding:9px 14px;border-radius:10px;border:0.5px solid var(--border-strong);background:var(--surface2);color:var(--text-primary);font-size:14px;font-family:inherit;outline:none;">
        <button onclick="closeSearch()" style="background:none;border:none;font-size:14px;color:var(--text-secondary);cursor:pointer;font-family:inherit;">取消</button>
      </div>
      <div id="search-results" style="flex:1;overflow-y:auto;padding:12px;"></div>
    </div>

    <!-- Calendar view -->
    <div id="calendar-view" style="display:none;position:absolute;top:57px;left:0;right:0;bottom:0;background:var(--bg);z-index:5;overflow-y:auto;padding:16px;">
      <div id="calendar-content"></div>
    </div>

    <!-- Settings view -->
    <div id="settings-view" style="display:none;position:absolute;top:57px;left:0;right:0;bottom:0;background:var(--bg);z-index:5;overflow-y:auto;">
      <div id="settings-content"></div>
    </div>

    <!-- Card view - inside app like closet-view -->
    <div id="card-view" style="display:none;position:absolute;top:57px;left:0;right:0;bottom:0;background:var(--bg);z-index:5;flex-direction:column;overflow-y:auto;">
      <div id="card-step-pick" style="padding:16px;">
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;" id="ootd-subtitle" data-zh="選擇卡片風格" data-en="Choose a card style">選擇卡片風格</p>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button class="tmpl-btn" onclick="ootdPickTemplate(1)">
            <div class="tmpl-thumb"><svg viewBox="0 0 38 48" fill="none"><rect x="1" y="1" width="36" height="30" rx="2" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="1" y="33" width="17" height="10" rx="1" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="20" y="33" width="17" height="10" rx="1" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="1" y="44" width="36" height="3" rx="1" fill="#d3d1c7"/></svg></div>
            <div class="tmpl-info"><strong>Card 01 — Story</strong><span id="tmpl-desc-1" data-zh="大圖 + 四格單品 + 文字" data-en="Big photo + 4 items + text">大圖 + 四格單品 + 文字</span></div>
          </button>
          <button class="tmpl-btn" onclick="ootdPickTemplate(2)">
            <div class="tmpl-thumb"><svg viewBox="0 0 38 48" fill="none"><rect x="1" y="1" width="17" height="21" rx="2" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="20" y="1" width="17" height="21" rx="2" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="1" y="24" width="17" height="21" rx="2" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="20" y="24" width="17" height="21" rx="2" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="1" y="44" width="36" height="3" rx="1" fill="#d3d1c7"/></svg></div>
            <div class="tmpl-info"><strong>Card 02 — Grid</strong><span id="tmpl-desc-2" data-zh="四格照片 + 文字" data-en="4 photos + text">四格照片 + 文字</span></div>
          </button>
          <button class="tmpl-btn" onclick="ootdPickTemplate(3)">
            <div class="tmpl-thumb"><svg viewBox="0 0 38 48" fill="none"><rect x="1" y="1" width="15" height="10" rx="1" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="1" y="13" width="15" height="10" rx="1" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="1" y="25" width="15" height="10" rx="1" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="1" y="37" width="15" height="10" rx="1" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/><rect x="18" y="1" width="19" height="46" rx="2" fill="#e8e7e5" stroke="#d3d1c7" stroke-width="0.5"/></svg></div>
            <div class="tmpl-info"><strong>Card 03 — Split</strong><span id="tmpl-desc-3" data-zh="左欄單品 + 右欄 OOTD 照" data-en="Items left + OOTD photo right">左欄單品 + 右欄 OOTD 照</span></div>
          </button>
        </div>
      </div>
      <div id="card-step-edit" style="display:none;flex:1;flex-direction:column;height:100%;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:0.5px solid var(--border);flex-shrink:0;background:var(--surface);">
          <button onclick="ootdBackToPick()" id="ootd-back-btn" style="background:none;border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--text);" data-zh="← 返回" data-en="← Back">← 返回</button>
          <span id="ootd-edit-title" style="font-size:14px;font-weight:500;"></span>
          <button onclick="ootdSave()" id="ootd-save-btn" style="background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);padding:6px 14px;cursor:pointer;font-size:13px;font-family:inherit;" data-zh="儲存" data-en="Save">儲存</button>
        </div>
        <div style="flex:1;overflow-y:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start;">
          <div id="ootd-card" style="width:100%;max-width:320px;aspect-ratio:4/5;position:relative;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,.12);"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="bottombar">
    <button class="nav-tab" id="tab-calendar" onclick="switchTab('calendar')">
      <span data-zh="日曆" data-en="Calendar">日曆</span>
    </button>
    <button class="nav-tab" id="tab-wardrobe" onclick="switchTab('wardrobe')">
      <span data-zh="衣櫥" data-en="Wardrobe">衣櫥</span>
    </button>
    <button class="nav-tab nav-tab-add" id="tab-add" onclick="openUpload()">
      <div class="nav-add-circle">+</div>
      <span data-zh="新增" data-en="Add">新增</span>
    </button>
    <button class="nav-tab active" id="tab-ootd" onclick="switchTab('ootd')">
      <span data-zh="今日穿搭" data-en="OOTD">今日穿搭</span>
    </button>
    <button class="nav-tab" id="tab-settings" onclick="switchTab('settings')">
      <span data-zh="設定" data-en="Settings">設定</span>
    </button>
  </div>

  <div class="modal-back" id="upload-modal">
    <div class="modal-sheet">
      <h2>新增衣物</h2>
      <div class="upload-cats">
        <button class="upload-cat-btn" data-cat="accessory" onclick="selectCat(this)"><i class="ti ti-diamond"></i> 配飾</button>
        <button class="upload-cat-btn" data-cat="jacket" onclick="selectCat(this)"><i class="ti ti-coat"></i> 外套</button>
        <button class="upload-cat-btn" data-cat="top" onclick="selectCat(this)"><i class="ti ti-shirt"></i> 上著</button>
        <button class="upload-cat-btn" data-cat="bottom" onclick="selectCat(this)"><i class="ti ti-layout-bottombar"></i> 下著</button>
        <button class="upload-cat-btn full" data-cat="shoes" onclick="selectCat(this)"><i class="ti ti-shoe"></i> 鞋子</button>
      </div>
      <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
      <div class="modal-actions">
        <button onclick="closeUpload()">取消</button>
        <button class="confirm-btn" onclick="triggerFile()"><i class="ti ti-upload"></i> 選擇照片</button>
      </div>
    </div>
  </div>

  <div id="card-modal">
    <div id="item-card">
      <div class="card-img-wrap">
        <button class="card-close" onclick="closeCard()" style="font-size:16px;font-weight:400;line-height:1;">&#x2715;</button>
        <img id="card-img" src="" alt="">
      </div>
      <div class="card-body">
        <div class="card-row"><span class="card-label" data-zh="分類" data-en="Category">分類</span><span class="card-val" id="cf-category" style="color:var(--text-muted);font-size:13px;">AI 辨識中...</span></div>
        <div class="card-row"><span class="card-label" data-zh="新增日期" data-en="Date Added">新增日期</span><span class="card-val" id="cf-date"></span></div>
        <div class="card-row" id="season-row">
          <span class="card-label" data-zh="季節" data-en="Season">季節</span>
          <div id="season-chips" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;flex:1;margin-left:8px;"></div>
        </div>
        <div class="card-row">
          <span class="card-label" data-zh="品牌" data-en="Brand">品牌</span>
          <button id="brand-btn" onclick="openBrandPicker()" style="font-size:14px;color:var(--text-primary);background:var(--surface2);border:0.5px solid var(--border-strong);border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
            <span id="cf-brand-val">選擇品牌</span>
          </button>
        </div>
        <div class="card-row" id="size-row">
          <span class="card-label" data-zh="尺寸" data-en="Size">尺寸</span>
          <div id="size-selector"></div>
        </div>
        <div class="card-row" id="tags-row">
          <span class="card-label" data-zh="標籤" data-en="Tags">標籤</span>
          <div id="tags-area" style="flex:1;margin-left:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;"></div>
        </div>
      </div>
      <button class="card-save-btn" onclick="saveCard()">儲存</button>
      <button id="card-delete-btn" onclick="deleteFromCard()" style="display:none;width:100%;padding:13px;border:none;background:none;color:#d64242;font-size:14px;font-family:inherit;cursor:pointer;margin-top:4px;" data-zh="刪除衣物" data-en="Delete Item">刪除衣物</button>
    </div>
  </div>

  <div id="closet-view">
    <div id="closet-tabs"></div>
    <div id="closet-content"></div>
  </div>



  <input type="file" id="ootd-file-input" accept="image/*" style="display:none;">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
  <script src="ootd.js"></script>
  <script src="calendar.js"></script>
  <script src="settings.js"></script>
</body>
</html>
