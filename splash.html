<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Build Your Own Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Bodoni+Moda:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;background:#ffffff;}
    #scene{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}

    /* W letter */
    #w-letter{
      font-family:'Playfair Display',Georgia,'Times New Roman',serif;
      font-weight:700;
      font-size:clamp(120px,32vw,200px);
      color:#111111;
      line-height:1;
      opacity:0;
      transform:translateZ(0);
      will-change:opacity;
      transition:none;
      position:absolute;
      -webkit-font-smoothing:antialiased;
      backface-visibility:hidden;
    }
    #w-letter.grow{
      transition:transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
      transform:scale(1.08);
    }
    #w-letter.fadeout{
      transition:opacity 0.5s ease;
      opacity:0;
    }

    /* Text */
    #text-wrap{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      opacity:0;
      pointer-events:none;
    }
    #text-wrap.fadein{
      transition:opacity 0.8s ease;
      opacity:1;
    }
    #text-main{
      font-family:'Playfair Display',Georgia,serif;
      font-weight:700;
      font-style:italic;
      font-size:clamp(28px,8vw,50px);
      color:#111111;
      letter-spacing:-0.01em;
      text-align:center;
      line-height:1.12;
    }
    #text-sub{
      margin-top:14px;
      font-family:'Playfair Display',Georgia,serif;
      font-weight:400;
      font-style:normal;
      font-size:clamp(9px,2.2vw,13px);
      color:#a0a0a0;
      letter-spacing:0.26em;
      text-transform:uppercase;
    }
  </style>
</head>
<body>
<div id="scene">
  <div id="w-letter">W</div>
  <div id="text-wrap">
    <div id="text-main">Build Your<br>Own Style</div>
    <div id="text-sub">Your wardrobe · Your way</div>
  </div>
</div>
<script>
document.fonts.ready.then(() => {
  const w = document.getElementById('w-letter');
  const txt = document.getElementById('text-wrap');

  // Step 0: fade in W
  w.style.transition = 'opacity 0.5s ease';
  w.style.opacity = '1';

  // Step 1: hold 1.8s then slowly fade out
  setTimeout(() => {
    w.style.transition = 'opacity 1s ease';
    w.style.opacity = '0';
  }, 1800);

  // Step 2: fade in text as W fades
  setTimeout(() => {
    txt.classList.add('fadein');
  }, 2400);

  // Step 3: go to app
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 4300);
});
</script>
</body>
</html>
